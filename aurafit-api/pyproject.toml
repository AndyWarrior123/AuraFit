[project]
name =  "aurafit-api"
version = "0.1.0"
description = "AuraFit gamified RPG fitness tracker - FastAPI backend"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aadi Redhu" }]
keywords = ["fastapi", "fitness", "rpg", "health", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [

    # ---- Web Framework --------------------
    "fastapi >= 0.115.5",
    "uvicorn[standard]>=0.32.1",        # 'standard' pulls in websockets + uvloop
    "python-multipart>=0.0.12",         # Required for FastAPI form () and file uploads

    # ---- Database -------------------------
    "sqlalchemy[asyncio]>=2.0.36",      # ORM + Core with async extension
    "asyncpg>=0.30.0",                  # PostgreSQL async driver 
    "alembic>=1.14.0",                  # Schema Migration Engine

    # ---- Validation & Configuration -------
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",         # .env -> typed Settings model
    "email-validator>=2.2.0",           # Enables Pydantic EmailStr

    # ---- Authentication -------------------
    "python-jose[cryptography]>=3.3.0", # JWT encode / decode
    "httpx>=0.28.1",                    # Async HTTP: Google tokeninfo + Fitness API

    # ---- AI Integration -------------------
    "google-generativeai>=0.8.3",
    
    # ---- Resilience -----------------------
    "tenacity>=9.0.0",                  # Exponential backoff for Gemini + Google APIs

    # ---- Observability --------------------
    "structlog>=24.4.0",                # Structured JSON logging

    # ---- Performance ----------------------
    "orjson>=3.10.12",                  # 2-3x fast JSON serialisation than stdlib

]

[project.optional-dependencies]

dev = [
    # Testing
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",                     # Mock httpx requests in unit tests

    # In-memory DB for service-layer unit tests (no Docker needed)
    "aiosqlite>=0.20.0",

    # Static analysis
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "types-python-jose>=3.3.4.20240106",

    # Pydantic + SQLAlchemy mypy plugins
    "pydantic[mypy]>=2.10.3",
]

# ---- Build Backend -------------------

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]


# ---- UV ------------------------------

[tool.uv]
# Mirrors [project.optional-dependencies.dev] so `uv sync` installs dev description
# without needing --extra=dev

dev-dependencies = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "types-python-jose>=3.3.4.20240106",
    "pydantic[mypy]>=2.10.3",
]

# ---- Ruff: Linting + Formatting -------

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (undefined names, unused imports)
    "I",     # isort (import ordering)
    "B",     # flake8-bugbear (likely bugs)
    "C4",    # flake8-comprehensions (use list/dict/set comprehensions)
    "UP",    # pyupgrade (use modern Python syntax)
    "N",     # pep8-naming conventions
    "S",     # flake8-bandit (security anti-patterns)
    "ANN",   # flake8-annotations (enforce type hints)
    "ASYNC", # flake8-async (async best practices)
    "TCH",   # flake8-type-checking (TYPE_CHECKING guard)
    "RUF",   # Ruff-native rules
]
ignore = [
    "S101",     # allow assert in tests
    "ANN101",   # no annotations on 'self'
    "ANN102",   # no annotations on 'cls'
    "B008",     # FastAPI requires function calls in default args (Depends, Query)
    "ANN401",   # allow Any in dependency injection signatures
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py"   = ["S", "ANN"]    # tests: silence security + annotation rules
"alembic/**/*.py" = ["ANN", "N999"] # generated migration files

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending  = "auto"


# ---- Mypy: Static Type Checking ------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["alembic/"]

plugins = [
    "pydantic.mypy",
    "sqlalchemy.ext.mypy.plugin",
]

[[tool.mypy.overrides]]
module = ["google.generativeai.*", "structlog.*", "asyncpg.*"]
ignore_missing_stubs = true

# ---- Pytest -------------------------------
[tool.pytest.ini_options]
asyncio_mode  = "auto"             # every async test function is auto-detected
testpaths     = ["tests"]
addopts       = "-v --tb=short --cov=app --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source  = ["app"]
omit    = ["app/db/versions/*", "tests/*"]

[tool.coverage.report]
show_missing = true
fail_under   = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
